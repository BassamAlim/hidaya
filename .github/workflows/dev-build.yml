name: Dev Build

# Builds a debug APK on every push to dev and publishes it to a rolling pre-release,
# so the latest dev build can be installed from a phone through one fixed link:
#
#   https://github.com/BassamAlim/hidaya/releases/download/dev-latest/hidaya-dev.apk
#
# The debug build is signed with the same keystore as release builds (see app/build.gradle),
# so each new build installs over the previous one without uninstalling.
#
# Uses the same repository secrets as release.yml:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, GOOGLE_SERVICES_JSON

on:
  push:
    branches: [dev]
  workflow_dispatch:

# A newer push makes an in-progress build pointless
concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Provide signing config
        # Same as release.yml: printf keeps secret values byte-for-byte, and the keytool
        # check fails fast if the keystore, password, or alias don't match.
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/upload-keystore.jks"
          {
            printf 'KEYSTORE_PATH=%s\n' "$GITHUB_WORKSPACE/upload-keystore.jks"
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > .env
          keytool -list -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Publish to the dev-latest pre-release
        # Recreating the release moves the dev-latest tag to this commit and replaces the
        # APK, while the download link stays the same. --latest=false keeps the real
        # store releases shown as "Latest".
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hidaya-dev.apk

          {
            echo "Debug build of \`dev\` at ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
            echo
            echo "Built $(date -u '+%Y-%m-%d %H:%M UTC') by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "Install link: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/dev-latest/hidaya-dev.apk"
          } > notes.md

          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest hidaya-dev.apk \
            --target "$GITHUB_SHA" \
            --title "Dev build (latest)" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
